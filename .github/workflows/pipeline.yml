name: Pipeline

# One workflow, two mutually-exclusive jobs, so no runner-minute is spent twice:
#   • verify  (pull_request only) — commitlint + manifests + portability suite, on ONE runner.
#   • release (push to main only) — semantic-release, with NO re-verify: branch protection
#     requires `verify` before merge, so the merged commit is already validated.
#
# This repo ships no application, so "deploy" is a release: a version tag plus the version synced
# into every plugin manifest. Claude Code decides whether users get an update by reading that
# field, so the release IS the distribution — nothing else has to happen.
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  verify:
    name: verify
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0            # commitlint needs the PR commit range

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # THE PULL REQUEST TITLE, because that is the text that actually lands.
      #
      # This linted the branch's individual commits, which a squash-merge THROWS AWAY — so it was
      # checking the discarded text and not checking the surviving text. Backwards on its own terms,
      # and the cost landed entirely on one group: GitHub's web editor pre-fills a commit message of
      # "Update FILENAME", which fails config-conventional. A contributor working in the browser got
      # a red check on their first pull request, for a field the page never mentioned, that they
      # cannot easily edit from where they are standing. Every rail here was built for processes;
      # this is what that assumption cost the first human through.
      #
      # The title is passed through the ENVIRONMENT rather than interpolated into the shell: a title
      # is attacker-controlled text on a public repository, and `run: echo "${{ ... }}"` is a script
      # injection with a friendly name.
      - name: Lint the pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | npx commitlint --verbose

      # Structural check that runs on bare Node — catches a marketplace entry pointing at a
      # directory that doesn't exist, a name mismatch, or a plugin nobody can install.
      - name: Validate manifests
        run: npm run validate

      # The authoritative check, using the same validator the community marketplace runs.
      - name: Validate with the Claude CLI
        run: |
          npm i -g @anthropic-ai/claude-code
          claude plugin validate .
          for p in plugins/*/; do claude plugin validate "$p"; done

      # Plugin manifests must carry NO version field. The ruleset forbids the release from pushing
      # a bump commit to main, so a committed version would silently go stale against the tag.
      - name: Check versions
        run: npm run check-versions

      # The DNA expression test — every gate run against a repo with a non-default layout.
      - name: Portability suite
        run: npm test

      # INSTALL ONLY. The list of what to check lives in tests/shell.test.mjs, which runs in the
      # suite below and skips loudly when shellcheck is absent — so this step exists purely to make
      # sure it is present here and the dimension is actually measured.
      #
      # This step used to re-glob `plugins/*/bin/*` itself, which was a SECOND list of the same
      # thing, and the two drifted the moment .cmd twins arrived: the test excluded them, the
      # workflow did not, and CI failed on batch files for not being shell. Two lists of one thing
      # do not stay equal; they stay equal until the first change, and then one of them is wrong
      # and nobody knows which.
      - name: Install shellcheck (the suite runs it)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

  release:
    name: release
    # Merged commits are already verified, so this path only ships.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
